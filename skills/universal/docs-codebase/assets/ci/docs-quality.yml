name: Docs Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.md"

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        # Adjust the glob to match your docs layout.
        # --config points at the shared config from this skill.
        run: |
          markdownlint \
            --config .markdownlint.yaml \
            "docs/**/*.md" "*.md" \
            --ignore node_modules \
            --ignore .archive

  link-check-internal:
    name: Markdown link check (internal, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Run internal link check
        # Relative links are under the repo's control, so a broken one fails
        # the job. .mlc-config.json (shipped with this skill; copy it to the
        # repo root) ignores http(s) and mailto links, which the advisory job
        # below checks instead.
        shell: bash
        run: |
          set -euo pipefail
          find docs -name "*.md" ! -path "*/.archive/*" -print0 \
            | xargs -0 -r -n1 markdown-link-check --quiet --config .mlc-config.json
          find . -maxdepth 1 -name "*.md" -print0 \
            | xargs -0 -r -n1 markdown-link-check --quiet --config .mlc-config.json

  link-check-external:
    name: Markdown link check (external, advisory)
    runs-on: ubuntu-latest
    # External sites fail transiently (rate limits, bot blocks, outages), so this
    # job reports without blocking the merge. Drop continue-on-error for strict mode.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Run external link check
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mlc-external.json <<'JSON'
          {
            "ignorePatterns": [
              { "pattern": "^(?!https?:)" },
              { "pattern": "^https?://(localhost|127\\.0\\.0\\.1)" }
            ],
            "retryOn429": true,
            "retryCount": 2,
            "timeout": "20s",
            "aliveStatusCodes": [200, 206, 301, 302, 307, 308]
          }
          JSON
          find docs -name "*.md" ! -path "*/.archive/*" -print0 \
            | xargs -0 -r -n1 markdown-link-check --quiet --config /tmp/mlc-external.json

  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vale
        uses: vale-cli/vale-action@v2
        with:
          # vale_flags is the action's config/CLI interface; config is not an input.
          vale_flags: --config=.vale.ini --minAlertLevel=error
          # Lint the docs/ directory. Adjust if your docs live elsewhere.
          files: docs/
          # Check the whole selected tree, including errors outside added lines.
          filter_mode: nofilter
          # Match the guide: errors block; local review can surface warnings.
          fail_on_error: true
        env:
          # Required for private repos when vale-action fetches style packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
