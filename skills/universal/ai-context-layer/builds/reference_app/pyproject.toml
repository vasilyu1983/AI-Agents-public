[project]
name = "ai-context-layer-reference-app"
version = "0.1.0"
description = "Reference implementation of RA1 (P1+P2+P5+P8) for the ai-context-layer skill."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=0.2"]
http = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
