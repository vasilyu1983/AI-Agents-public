# Git Commit Message Generator - Project Configuration
# Guidance for diff classification, scope selection, and validation in this repo.

project:
  name: "AI-Agents"
  type: "prompt-and-skill-library"
  description: "Shared prompt, agent, and skill repository with repo-specific scope mapping"

# Directory patterns -> scope names
# Patterns are matched in order. If none match, fall back to the nearest stable directory.
scope_mapping:
  # Framework surfaces
  "frameworks/claude-code-kit/**": "claude-kit"
  "frameworks/shared-skills/**": "shared-skills"
  "frameworks/scripts/**": "frameworks-scripts"
  "frameworks/a-smart-deploy/**": "smart-deploy"

  # Custom GPT categories
  "custom-gpt/education/**": "gpt-education"
  "custom-gpt/lifestyle/**": "gpt-lifestyle"
  "custom-gpt/productivity/**": "gpt-productivity"
  "custom-gpt/programming/**": "gpt-programming"
  "custom-gpt/research-n-analysis/**": "gpt-research"
  "custom-gpt/writing/**": "gpt-writing"
  "custom-gpt/acme/**": "gpt-acme"
  "custom-gpt/**": "gpt"

  # AI agents
  "ai-agents/acme/**": "agents-acme"
  "ai-agents/Q/**": "agents-q"
  "ai-agents/**": "agents"

  # Documentation
  "docs/plans/**": "docs-plans"
  "docs/assessment/**": "docs-assessment"
  "docs/diagrams/**": "docs-diagrams"
  "docs/seo-aeo-report/**": "docs-seo-aeo"
  "docs/scripts/**": "docs-scripts"
  "docs/**": "docs"

  # Repository infrastructure
  ".claude/**": "tooling"
  ".cursor/**": "tooling"
  ".github/**": "ci"

  # Root files
  "AGENTS.md": "meta"
  "CLAUDE.md": "meta"
  "README.md": "docs"

conventional_commits:
  standard_types:
    - "feat"
    - "fix"
    - "perf"
    - "refactor"
    - "docs"
    - "test"
    - "build"
    - "ci"
    - "chore"
    - "style"
    - "revert"

  repo_extension_types:
    - "security"

  prefer_standard_types: true
  security_type_policy: "Prefer fix(security), chore(security), or feat(security). Use security: only if the repo already lints and releases it as a first-class local type."

  require_scope_for:
    - "feat"
    - "fix"
    - "perf"

  optional_scope_for:
    - "refactor"
    - "docs"
    - "test"
    - "build"
    - "ci"
    - "chore"
    - "style"
    - "revert"
    - "security"

  max_summary_length: 72
  ideal_summary_length: 50
  imperative_mood: true
  lowercase_description: true
  no_period_at_end: true

body_policy:
  default: "subject_only"
  add_body_when:
    - "breaking change"
    - "security-sensitive change"
    - "non-obvious rationale"
    - "caller explicitly asks for detail"
  detailed_template: |
    <type>(<scope>): <summary>

    Why:
    - ...

    What:
    - ...

    Notes:
    - Tests: ...
    - Risks/rollback: ...

scope_detection:
  strategy: "mapped-root-then-nearest-stable-directory"
  rules:
    - "If all files live under frameworks/shared-skills/skills/<skill-name>/, use <skill-name>."
    - "If all files live under one mapped repo surface, use the nearest stable child directory when it improves clarity."
    - "If a change spans more than 3 stable areas, omit scope or use a broader repo surface."
    - "Prefer repository-native names over generic scopes such as repo, misc, or update."

analysis_patterns:
  feat:
    hints:
      - "new runnable surface, workflow, command, template, or capability"
      - "new agent, skill, prompt, or automation behavior"

  fix:
    hints:
      - "behavior correction, bug reproduction, validation fix, broken link repair, or stale mapping correction"

  refactor:
    hints:
      - "structure, navigation, or wording improved without intended behavior change"

  docs:
    hints:
      - "pure explanatory or reference copy change with no behavior or policy change"
    caution: "In this repo, Markdown, YAML, and JSON changes can still be feat or fix. Do not classify by extension alone."

  chore:
    hints:
      - "dependency, housekeeping, or low-risk tooling maintenance"

forbidden_patterns:
  - pattern: "^(update|fix|change|misc|stuff|things?|code)$"
    reason: "Too vague - name the changed behavior or surface"
    examples:
      - "update -> docs(readme): add setup steps"
      - "fix -> fix(auth): reject expired refresh tokens"

  - pattern: "(generated by|co-authored-by:.*(copilot|claude|chatgpt|gpt|ai|assistant|bot)|via (copilot|claude|chatgpt|ai))"
    reason: "Assistant or tool attribution is not allowed in commit messages"

  - pattern: "^wip[:\\s]"
    reason: "WIP commits should be squashed before merging"
    severity: "warning"

  - pattern: "^(temp|tmp|checkpoint)[:\\s]"
    reason: "Temporary commits should be squashed before merging"
    severity: "warning"

  - pattern: "^(?!(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert|security)(\\([a-z0-9][a-z0-9,._/-]*\\))?(!)?:\\s).+"
    reason: "Commit must start with a conventional prefix: type(scope): summary"

  - pattern: "^(feat|fix|docs|security)(\\([^)]+\\))?:\\s*(add|update|fix|change)$"
    reason: "Description is too vague - name what changed"
    examples:
      - "feat(api): add -> feat(api): add user search endpoint"

validation:
  mode: "strict"
  block_on_forbidden: true
  block_on_length_exceeded: true
  block_on_missing_type: true
  show_examples_on_error: true

output:
  show_analysis: true
  show_alternatives: true
  alternative_count: 2
  show_character_count: true
  show_validation: true

integration:
  related_skill: "../dev-git-workflow/SKILL.md"
  note: "Use dev-git-workflow for hook setup, branching, PR workflow, and release automation."

version: "3.0.0"
last_updated: "2026-03-13"
